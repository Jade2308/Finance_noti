services:
  - type: web
    name: vn-finance-hub
    env: python
    region: singapore # hoặc oregon, frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: PORTFOLIO_JSON
        sync: false
      - key: TZ
        value: Asia/Ho_Chi_Minh
